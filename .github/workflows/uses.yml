name: Uses Examples

on:
  workflow_dispatch:

jobs:
  uses-example:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
      - name: Use Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Run script
        run: python my_script.py
