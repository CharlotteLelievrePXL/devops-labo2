name: Conditional Deployment

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Kies de doelomgeving'
        required: true
        default: 'development'
        type: choice
        options:
          - development
          - staging
          - production

jobs:
  deploy-check:
    runs-on: ubuntu-latest
    steps:
      - name: Production deployment
        if: github.event.inputs.environment == 'production'
        run: echo "Deploying to production!"

      - name: Test mode deployment
        if: github.event.inputs.environment == 'development' || github.event.inputs.environment == 'staging'
        run: echo "Running in test mode"

      - name: Toon gekozen environment (altijd)
        if: always()
        run: |
          echo "Gekozen environment is: ${{ github.event.inputs.environment }}"